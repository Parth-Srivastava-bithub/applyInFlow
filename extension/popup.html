<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AutoApply Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 280px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      background: #2563eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 16px;
    }
    .title-box h1 {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .title-box p {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #94a3b8;
      font-size: 11px;
    }
    .val {
      font-weight: 600;
      color: #f1f5f9;
      font-size: 12px;
    }
    .badge-online {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #4ade80;
      font-weight: 600;
      font-size: 11px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
    }
    .btn-dashboard {
      display: block;
      width: 100%;
      text-align: center;
      background: #2563eb;
      color: #ffffff;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-dashboard:hover {
      background: #1d4ed8;
    }
    .footer-note {
      text-align: center;
      margin-top: 10px;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">A</div>
    <div class="title-box">
      <h1>AutoApply Assistant</h1>
      <p>LinkedIn Outreach Companion</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="label">Engine</span>
      <span class="badge-online"><span class="dot"></span> Active</span>
    </div>
    <div class="status-row">
      <span class="label">Mode</span>
      <span class="val">Dashboard Controlled</span>
    </div>
    <div class="status-row">
      <span class="label">Version</span>
      <span class="val">v1.0.0</span>
    </div>
  </div>

  <button class="btn-dashboard" id="btn-open-dashboard">Open AutoApply Dashboard →</button>

  <p class="footer-note">Ready to scrape hiring leads directly from your authenticated LinkedIn session.</p>

  <script src="popup.js"></script>
</body>
</html>
