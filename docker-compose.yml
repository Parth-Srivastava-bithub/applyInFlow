services:
  autoapply:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoapply:latest
    container_name: autoapply-app
    restart: unless-stopped
    ports:
      - "5000:5000"   # AutoApply Dashboard Web UI
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      # Persistent AutoApply output (emails, contacts, tailored resumes, logs)
      - ./output:/app/output

  # Microservice for LaTeX PDF resume compilation
  latex-compiler:
    build:
      context: ./latex_resume
      dockerfile: Dockerfile
    image: autoapply-latex:latest
    container_name: latex-compiler
    restart: unless-stopped
    ports:
      - "8001:8001"   # LaTeX Compiler Microservice
